[workspace]
name = "count-data"
channels = ["https://prefix.dev/almost-conductor", "conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = ">=3.14.4,<3.15"
bash = ">=5.2.37,<6"
hapiq = "*"
anndata = ">=0.12.14,<0.13"
muon = ">=0.1.7,<0.2"
openpyxl = ">=3.1.5,<4"

[tasks]
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) count-data.yaml && printf '# auto-generated by pixi — do not edit by hand\\n' | cat - count-data.yaml > count-data.yaml.tmp && mv count-data.yaml.tmp count-data.yaml"